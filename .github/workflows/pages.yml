name: Deploy to GitHub Pages

# docs/ is a generated mirror pushed by the private house-of-arqam/sponsir-extension
# repo (its .github/workflows/pages.yml); it has already passed that repo's site
# checks. Requires Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every published page returns 200
        run: |
          for page in "" check.html checkout.html key.html devices.html privacy.html terms.html support.html; do
            url="https://sponsir.app/${page}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || exit 1
          done
